<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #1a1a1a; --bg-surface: #242424; --bg-hover: #2e2e2e;
      --text: #e8e8e8; --text-dim: #888;
      --accent: #c084fc; --accent-dim: rgba(192,132,252,0.15);
      --border: rgba(255,255,255,0.06); --radius: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px; background: var(--bg); color: var(--text);
      font-family: 'JetBrains Mono','SF Mono',monospace;
      font-size: 12px; padding: 16px; line-height: 1.5;
    }

    /* Header */
    .header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 16px; padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .header .bolt { font-size: 18px; line-height: 1; }
    .header h1 { font-size: 13px; font-weight: 600; letter-spacing: -0.02em; }
    .header .version { color: var(--text-dim); font-size: 10px; margin-left: auto; }

    /* Control row */
    .control {
      display: flex; align-items: center;
      justify-content: space-between; padding: 8px 0;
    }
    .control-text { font-size: 11px; user-select: none; }
    .sublabel { font-size: 10px; color: var(--text-dim); margin-top: 2px; }

    /* ─── Toggle switch ───
       The ENTIRE toggle is a <label> wrapping a hidden checkbox.
       Clicking anywhere on the label toggles the checkbox. */
    .toggle-label {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
      cursor: pointer;
    }
    .toggle-label input {
      /* Hidden but still functional */
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }
    .toggle-track {
      position: absolute;
      inset: 0;
      background: var(--bg-surface);
      border-radius: 20px;
      border: 1px solid var(--border);
      transition: background 0.2s, border-color 0.2s;
    }
    .toggle-track::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      background: var(--text-dim);
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }
    .toggle-label input:checked + .toggle-track {
      background: var(--accent-dim);
      border-color: var(--accent);
    }
    .toggle-label input:checked + .toggle-track::after {
      transform: translateX(16px);
      background: var(--accent);
    }

    /* Slider group */
    .slider-group {
      margin: 12px 0; padding: 12px; background: var(--bg-surface);
      border-radius: var(--radius); border: 1px solid var(--border);
    }
    .slider-header {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 8px;
    }
    .slider-header span { font-size: 11px; }
    .slider-value {
      color: var(--accent); font-weight: 600;
      font-size: 13px; min-width: 28px; text-align: right;
    }
    input[type="range"] {
      -webkit-appearance: none; width: 100%; height: 4px;
      background: var(--bg); border-radius: 4px; outline: none; cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px;
      background: var(--accent); border-radius: 50%; cursor: pointer;
      box-shadow: 0 0 8px rgba(192,132,252,0.4);
    }
    input[type="range"]::-moz-range-thumb {
      width: 16px; height: 16px; background: var(--accent);
      border-radius: 50%; border: none; cursor: pointer;
    }

    .divider { height: 1px; background: var(--border); margin: 8px 0; }

    .btn {
      display: block; width: 100%; padding: 8px; margin-top: 12px;
      background: var(--bg-surface); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius);
      font-family: inherit; font-size: 11px; cursor: pointer; text-align: center;
      transition: background 0.15s;
    }
    .btn:hover { background: var(--bg-hover); }

    .status {
      margin-top: 12px; padding: 8px; background: var(--bg-surface);
      border-radius: var(--radius); border: 1px solid var(--border);
      font-size: 10px; color: var(--text-dim); text-align: center;
    }
    .status .count { color: var(--accent); font-weight: 600; }
    .status .strategy { color: #fbbf24; }
    .status.error { color: #f87171; }

    .tag {
      display: inline-block; font-size: 8px; text-transform: uppercase;
      letter-spacing: 0.08em; padding: 1px 5px; border-radius: 4px;
      margin-left: 6px; vertical-align: middle;
    }
    .tag-beta { color: #fbbf24; background: rgba(251,191,36,0.1); }
    .tag-new  { color: #34d399; background: rgba(52,211,153,0.1); }

    .hint {
      margin-top: 8px; padding: 6px 8px;
      background: rgba(192,132,252,0.06);
      border: 1px solid rgba(192,132,252,0.12);
      border-radius: 6px; font-size: 10px; color: #a1a1aa;
      line-height: 1.5;
    }
    .hint b { color: #c084fc; font-weight: 500; }
  </style>
</head>
<body>

  <div class="header">
    <span class="bolt">⚡</span>
    <h1>LightSession</h1>
    <span class="version">v2.1</span>
  </div>

  <!-- Enabled -->
  <div class="control">
    <span class="control-text">Extension enabled</span>
    <label class="toggle-label">
      <input type="checkbox" id="enabled" checked>
      <span class="toggle-track"></span>
    </label>
  </div>

  <!-- Keep N messages -->
  <div class="slider-group">
    <div class="slider-header">
      <span>Keep last</span>
      <span class="slider-value" id="keepValue">20</span>
    </div>
    <input type="range" id="keepMessages" min="2" max="100" value="20" step="1">
  </div>

  <!-- Status pill -->
  <div class="control">
    <span class="control-text">Status pill</span>
    <label class="toggle-label">
      <input type="checkbox" id="showStatus" checked>
      <span class="toggle-track"></span>
    </label>
  </div>

  <div class="divider"></div>

  <!-- Debug panel -->
  <div class="control">
    <div>
      <span class="control-text">Debug panel</span>
      <div class="sublabel">Live DOM metrics + validation</div>
    </div>
    <label class="toggle-label">
      <input type="checkbox" id="showDebug">
      <span class="toggle-track"></span>
    </label>
  </div>

  <button class="btn" id="refreshBtn">↻ Refresh (restore all messages)</button>

  <div class="status" id="statusReadout">Checking...</div>

  <div class="hint">
    <b>Tip:</b> Trimming only kicks in when message count &gt; keep.
    Lower the slider or open a longer chat to test.
  </div>

  <script src="popup.js"></script>
</body>
</html>
